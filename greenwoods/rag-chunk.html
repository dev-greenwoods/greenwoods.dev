<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chunker — greenwoods.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/rag-chunk.css" />
  <script src="js/theme.js"></script>
</head>
<body>
<div class="wrapper">
  <nav>
    <div class="nav-left">
      <a href="/" class="logo"><span class="logo-dot"></span>greenwoods.dev</a>
      <span class="breadcrumb">/ <span>rag chunker</span></span>
    </div>
    <button class="theme-toggle" title="Toggle theme">☾</button>
    <div class="nav-badge ai-badge">AI · LLM</div>
  </nav>

  <main>
    <!-- LEFT: Input + settings -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">input text</span>
        <div class="panel-actions">
          <button class="btn-sm" id="btnSample">sample</button>
          <button class="btn-sm" id="btnClear">clear</button>
        </div>
      </div>
      <div class="panel-body">
        <textarea id="inputArea" class="tool-input" style="flex:1;min-height:200px"
          placeholder="Paste your document, article, or code here to split it into RAG-ready chunks…"
          spellcheck="false"></textarea>

        <!-- Settings -->
        <div class="settings-card">
          <div class="settings-row">
            <div class="setting-item">
              <label class="field-label">Strategy</label>
              <div class="seg-ctrl">
                <button class="seg active" data-strat="tokens">by tokens</button>
                <button class="seg" data-strat="sentences">by sentences</button>
                <button class="seg" data-strat="paragraphs">by paragraphs</button>
              </div>
            </div>
          </div>

          <div class="settings-row" id="tokenSettings">
            <div class="setting-item">
              <label class="field-label">Chunk size <span class="field-unit" id="unitLabel">tokens</span></label>
              <div class="slider-row">
                <input type="range" id="chunkSize" min="50" max="2000" value="512" step="50" />
                <input type="number" id="chunkSizeNum" value="512" min="50" max="2000" class="tool-input num-input" />
              </div>
            </div>
            <div class="setting-item" id="overlapSetting">
              <label class="field-label">Overlap <span class="field-unit" id="overlapUnit">tokens</span></label>
              <div class="slider-row">
                <input type="range" id="overlap" min="0" max="200" value="50" step="10" />
                <input type="number" id="overlapNum" value="50" min="0" max="200" class="tool-input num-input" />
              </div>
            </div>
          </div>

          <div class="settings-row" id="sentSettings" style="display:none">
            <div class="setting-item">
              <label class="field-label">Sentences per chunk</label>
              <div class="slider-row">
                <input type="range" id="sentCount" min="1" max="20" value="5" step="1" />
                <input type="number" id="sentCountNum" value="5" min="1" max="20" class="tool-input num-input" />
              </div>
            </div>
          </div>
        </div>

        <div class="doc-stats" id="docStats">
          <span id="dsTotalToks">0 tokens</span>
          <span class="ds-sep">·</span>
          <span id="dsTotalChars">0 chars</span>
          <span class="ds-sep">·</span>
          <span id="dsChunkCount">0 chunks</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Chunks -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">chunks</span>
        <div class="panel-actions">
          <button class="btn-sm" id="btnCopyAll">copy JSON</button>
          <span class="panel-hint" id="chunkHint"></span>
        </div>
      </div>
      <div class="panel-body" id="chunksPanel">
        <div class="empty-state">
          <div class="empty-icon">🧩</div>
          <div>Paste text to see your chunks</div>
          <div style="font-size:0.65rem;color:var(--faint)">Each chunk shows token count and overlap with the next</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span><span class="logo-dot" style="display:inline-block;width:6px;height:6px;vertical-align:middle;margin-right:6px"></span>greenwoods.dev</span>
    <span>Browser-native text chunking for RAG pipelines · zero telemetry</span>
  </footer>
</div>
<script type="module" src="js/rag-chunk.js"></script>
</body>
</html>
