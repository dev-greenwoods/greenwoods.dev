<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regex Explainer — greenwoods.dev</title>
  <meta name="description" content="Paste any regex and get a plain-English breakdown of every token — anchors, groups, quantifiers, character classes and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/regex-explainer.css" />
</head>
<body>
<div class="wrapper">

  <nav>
    <div class="nav-left">
      <a href="/" class="logo"><span class="logo-dot"></span>greenwoods.dev</a>
      <span class="breadcrumb">/ <span>regex explainer</span></span>
    </div>
    <div class="nav-badge">regex</div>
  </nav>

  <main>

    <!-- LEFT: Input -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">pattern</span>
        <div class="panel-actions">
          <button class="btn-sm" onclick="loadSample()">sample</button>
          <button class="btn-sm" onclick="clearAll()">clear</button>
        </div>
      </div>
      <div class="panel-body" style="flex-direction:column; gap:0; padding:0;">

        <!-- Regex input -->
        <div style="padding: 0 16px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border);">
          <span style="color:var(--muted);font-size:1.1rem;flex-shrink:0;">/</span>
          <input
            id="patternInput"
            type="text"
            class="tool-input"
            placeholder="^[\w.+-]+@[\w-]+\.[a-z]{2,}$"
            spellcheck="false"
            style="border:none;min-height:48px;padding:0;border-radius:0;font-size:0.9rem;"
          />
          <span style="color:var(--muted);font-size:1.1rem;flex-shrink:0;">/</span>
        </div>

        <!-- Flag toggles -->
        <div class="flags-row">
          <span class="flag-label">flags</span>
          <button class="flag-toggle" data-flag="g">g</button>
          <button class="flag-toggle" data-flag="i">i</button>
          <button class="flag-toggle" data-flag="m">m</button>
          <button class="flag-toggle" data-flag="s">s</button>
          <button class="flag-toggle" data-flag="u">u</button>
        </div>

        <!-- Error -->
        <div id="patternError" class="error-msg hidden" style="margin:10px 16px;"></div>

        <!-- Test input -->
        <div class="test-section">
          <div class="test-header">
            <span class="test-label">test input</span>
          </div>
          <textarea
            id="testInput"
            class="tool-input test-input"
            placeholder="Paste text here to see matches highlighted…"
            spellcheck="false"
          ></textarea>
          <div id="testOutput" class="test-output">&nbsp;</div>
        </div>

      </div>
      <div class="status-bar">
        <span id="statusText">Enter a pattern to begin.</span>
      </div>
    </div>

    <!-- RIGHT: Visual breakdown + explanations -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">breakdown</span>
        <div class="panel-actions">
          <span style="font-size:0.65rem;color:var(--muted)">hover to link tokens</span>
        </div>
      </div>
      <div class="panel-body" style="flex-direction:column; gap:0; padding:0; overflow:hidden;">

        <!-- Token visual strip -->
        <div id="visual" class="visual-wrap">
          <div class="empty-visual">Enter a regex pattern above</div>
        </div>

        <!-- Explanation list -->
        <div id="expList" class="exp-list"></div>

        <!-- Active flags panel -->
        <div id="flagsPanel" class="flags-panel"></div>

      </div>
    </div>

  </main>

  <footer>
    <span>greenwoods.dev — regex explainer</span>
    <span>all analysis in browser · no data sent · no telemetry</span>
  </footer>

</div>
<script defer src="js/regex-explainer.js"></script>
</body>
</html>
