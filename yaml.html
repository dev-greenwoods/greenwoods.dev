<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YAML ↔ JSON — greenwoods.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/yaml.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="js/theme.js"></script>
</head>
<body>
<div class="wrapper">
  <nav>
    <div class="nav-left">
      <a href="/" class="logo"><span class="logo-dot"></span>greenwoods.dev</a>
      <span class="breadcrumb">/ <span>yaml ↔ json</span></span>
    </div>
    <div id="modeBadge" class="nav-badge">yaml → json</div>
    <button class="theme-toggle" title="Toggle theme">☾</button>
  </nav>

  <main>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title" id="inputTitle">yaml input</span>
        <div class="panel-actions">
          <button class="tab active" id="tabYJ" onclick="setMode('yaml-json')">yaml → json</button>
          <button class="tab" id="tabJY"       onclick="setMode('json-yaml')">json → yaml</button>
          <button class="btn-sm" onclick="loadSample()">sample</button>
          <button class="btn-sm" onclick="clearAll()">clear</button>
        </div>
      </div>
      <div class="panel-body">
        <textarea id="yamlInput" class="tool-input" placeholder="Paste YAML here..." oninput="convert()"></textarea>
        <div id="inputError" class="error-msg hidden"></div>
      </div>
      <div class="status-bar">
        <span id="statusText">Paste YAML or JSON to convert.</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title" id="outputTitle">json output</span>
        <div class="panel-actions">
          <button class="btn-sm" onclick="swapPanels()">⇄ swap</button>
          <button class="btn-sm" id="copyBtn" onclick="copyOutput()">copy</button>
        </div>
      </div>
      <div class="panel-body">
        <div id="yamlOutput" class="output-block">
          <div class="empty-state"><div class="empty-icon">⇄</div><div>Output will appear here</div></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>greenwoods.dev — yaml ↔ json</span>
    <span>powered by js-yaml · all conversion in browser · no server</span>
  </footer>
</div>
<script defer src="js/yaml.js"></script>
</body>
</html>
