<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator — greenwoods.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/password.css" />
</head>
<body>
<div class="wrapper">
  <nav>
    <div class="nav-left">
      <a href="/" class="logo"><span class="logo-dot"></span>greenwoods.dev</a>
      <span class="breadcrumb">/ <span>password generator</span></span>
    </div>
    <div id="strengthBadge" class="nav-badge">strength: —</div>
  </nav>

  <main>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">options</span>
      </div>
      <div class="panel-body">
        <div class="field-group">
          <div class="len-label-row">
            <span class="field-label">length</span>
            <span id="lenDisplay" class="len-display">16</span>
          </div>
          <input type="range" id="lengthSlider" min="4" max="128" value="16" oninput="onLengthChange()" class="slider" />
          <div class="len-presets">
            <button class="count-btn" onclick="setLength(8)">8</button>
            <button class="count-btn" onclick="setLength(12)">12</button>
            <button class="count-btn" onclick="setLength(16)">16</button>
            <button class="count-btn" onclick="setLength(24)">24</button>
            <button class="count-btn" onclick="setLength(32)">32</button>
            <button class="count-btn" onclick="setLength(64)">64</button>
          </div>
        </div>

        <div class="field-group">
          <span class="field-label">character sets</span>
          <label class="opt-label"><input type="checkbox" id="chkUpper" checked onchange="generate()" /> Uppercase (A–Z)</label>
          <label class="opt-label"><input type="checkbox" id="chkLower" checked onchange="generate()" /> Lowercase (a–z)</label>
          <label class="opt-label"><input type="checkbox" id="chkNum" checked onchange="generate()" /> Numbers (0–9)</label>
          <label class="opt-label"><input type="checkbox" id="chkSym" checked onchange="generate()" /> Symbols (!@#$...)</label>
        </div>

        <div class="field-group">
          <span class="field-label">extra rules</span>
          <label class="opt-label"><input type="checkbox" id="chkNoAmb" onchange="generate()" /> Exclude ambiguous (0 O l I 1)</label>
          <label class="opt-label"><input type="checkbox" id="chkNoRep" onchange="generate()" /> No repeating characters</label>
        </div>

        <div class="field-group">
          <span class="field-label">count</span>
          <div class="len-presets">
            <button class="count-btn" onclick="setCount(1)">1</button>
            <button class="count-btn" onclick="setCount(5)">5</button>
            <button class="count-btn" onclick="setCount(10)">10</button>
          </div>
        </div>

        <button class="btn-primary" onclick="generate()" style="align-self:flex-start">generate →</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">passwords</span>
        <div class="panel-actions">
          <button class="btn-sm" onclick="copyAll()">copy all</button>
          <button class="btn-sm" onclick="generate()">↺ regenerate</button>
        </div>
      </div>
      <div class="panel-body">
        <div id="strengthMeter" class="strength-meter hidden">
          <div class="strength-bar"><div id="strengthFill" class="strength-fill"></div></div>
          <div id="strengthInfo" class="strength-info"></div>
        </div>
        <div id="pwOutput" class="pw-output">
          <div class="empty-state"><div class="empty-icon">🔑</div><div>Click generate</div></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>greenwoods.dev — password generator</span>
    <span>uses crypto.getRandomValues · cryptographically secure · no server</span>
  </footer>
</div>
<script defer src="js/password.js"></script>
</body>
</html>
