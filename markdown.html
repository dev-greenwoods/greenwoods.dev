<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Previewer — greenwoods.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/markdown.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="js/theme.js"></script>
</head>
<body>
<div class="wrapper">
  <nav>
    <div class="nav-left">
      <a href="/" class="logo"><span class="logo-dot"></span>greenwoods.dev</a>
      <span class="breadcrumb">/ <span>markdown</span></span>
    </div>
    <div id="statBadge" class="nav-badge">0 words</div>
    <button class="theme-toggle" title="Toggle theme">☾</button>
  </nav>

  <main>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">markdown</span>
        <div class="panel-actions">
          <button class="btn-sm" onclick="loadSample()">sample</button>
          <button class="btn-sm" onclick="clearAll()">clear</button>
        </div>
      </div>
      <div class="panel-body" style="padding:0">
        <textarea id="mdInput" class="md-input" placeholder="# Type markdown here..." oninput="render()"></textarea>
      </div>
      <div class="status-bar">
        <span id="statusText">0 chars · 0 lines</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">preview</span>
        <div class="panel-actions">
          <button class="btn-sm" onclick="copyHtml()">copy html</button>
          <button class="btn-sm" onclick="copyMd()">copy md</button>
        </div>
      </div>
      <div class="panel-body" style="padding:0">
        <div id="preview" class="md-preview">
          <div class="empty-state"><div class="empty-icon">📄</div><div>Preview will appear here</div></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>greenwoods.dev — markdown previewer</span>
    <span>rendered client-side with marked.js · no data sent to server</span>
  </footer>
</div>
<script defer src="js/markdown.js"></script>
</body>
</html>
