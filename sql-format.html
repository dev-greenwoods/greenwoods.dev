<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Formatter — greenwoods.dev</title>
  <meta name="description" content="Paste messy SQL and get it formatted with proper indentation, keyword casing, and syntax highlighting." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/sql-format.css" />
</head>
<body>
<div class="wrapper">
  <nav>
    <div class="nav-left">
      <a href="/" class="logo"><span class="logo-dot"></span>greenwoods.dev</a>
      <span class="breadcrumb">/ <span>sql formatter</span></span>
    </div>
    <div class="nav-badge">sql</div>
  </nav>

  <main>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">sql input</span>
        <div class="panel-actions">
          <button class="btn-sm" onclick="loadSample()">sample</button>
          <button class="btn-sm" onclick="clearAll()">clear</button>
        </div>
      </div>
      <div class="panel-body">
        <textarea id="sqlInput" class="tool-input" placeholder="select u.id,u.name from users u where u.active=true and u.created_at>'2024-01-01' order by u.name;" spellcheck="false" oninput="run()"></textarea>
      </div>
      <div class="opts-row">
        <label>indent
          <select id="indentSize">
            <option value="2" selected>2 spaces</option>
            <option value="4">4 spaces</option>
          </select>
        </label>
        <label><input type="checkbox" id="chkUpper" checked /> uppercase keywords</label>
        <label><input type="checkbox" id="chkCommas" /> commas on new line</label>
      </div>
      <div class="status-bar"><span id="statusText">Paste SQL to format and highlight.</span></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">formatted</span>
        <div class="panel-actions">
          <button class="btn-sm" id="copyBtn" onclick="copyOutput()">copy</button>
        </div>
      </div>
      <div class="panel-body" style="padding:0; overflow:hidden;">
        <div id="sqlOutput" style="flex:1; overflow-y:auto;">
          <div class="empty-state">
            <div class="empty-icon" style="opacity:.2;font-size:1rem">SQL</div>
            <div>Paste SQL above to format</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>greenwoods.dev — sql formatter</span>
    <span>all formatting in browser · no data sent · no telemetry</span>
  </footer>
</div>
<script defer src="js/sql-format.js"></script>
</body>
</html>
