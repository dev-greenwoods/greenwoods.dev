<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Case Converter — Free, Private, In Your Browser | Greenwoods</title>
  <meta name="description" content="Use Case Converter in your browser. camelCase · PascalCase · snake_case · kebab-case · CONSTANT_CASE · Title Case · 4 more. Free and private — your input stays on your device." />
  <meta name="theme-color" content="#0B3D2E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Convert any string between camelCase, PascalCase, snake_case, kebab-case, SCREAMING_SNAKE, Title Case, and 10 more formats instantly." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />

<body>
<div class="wrapper">

  <nav>
    <div class="nav-left">
      <a href="/" class="logo"><span class="logo-dot"></span>greenwoods.dev</a>
      <span class="breadcrumb">/ <span>case converter</span></span>
    </div>
    <button class="theme-toggle" title="Toggle theme">☾</button>
    <div class="nav-badge">case</div>
  </nav>
  <h1 class="page-title">Case Converter</h1>

  <main style="display:block; overflow:hidden;">
  <div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">

    <!-- Input panel -->
    <div class="panel" style="flex-shrink:0; height:auto; max-height:160px; border-bottom: 1px solid var(--border);">
      <div class="panel-header">
        <span class="panel-title">input</span>
        <div class="panel-actions">
          <button class="btn-sm" onclick="clearAll()">clear</button>
        </div>
      </div>
      <div class="panel-body" style="padding:0;">
        <textarea
          id="inputText"
          class="tool-input"
          placeholder="myVariableName  or  my-css-class  or  MY_CONSTANT  or  Hello World…"
          spellcheck="false"
          style="min-height:80px; border:none; border-radius:0;"
        ></textarea>
      </div>
      <div class="status-bar"><span id="statusText">Type or paste text above to convert.</span></div>
    </div>

    <!-- Output cards -->
    <div id="outputCards" class="output-cards"></div>

  </div>
  </main>

  <footer>
    <span>greenwoods.dev — case converter</span>
    <span>all conversion in browser · no data sent · no telemetry</span>
  </footer>
